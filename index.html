<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matthew Bostic</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #0b0c10;
      color: #e7e9ee;
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: min(95vw, 1200px);
      text-align: center;
    }

    h1 {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 600;
      margin: 0 0 30px 0;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .stream {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,255,255,0.08);
    }

    .stream iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .subtitle {
      margin-top: 15px;
      color: #9aa3b2;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="name">Matthew Bostic</h1>

    <div class="stream">
      <iframe
        src="https://player.twitch.tv/?channel=twucky&parent=matthewbostic.com&parent=matthewbostic.github.io"
        allowfullscreen>
      </iframe>
    </div>

    <div class="subtitle">
      Live Bambu H2D Printer Cam
    </div>
  </div>

  <script>
    const name = document.getElementById('name');

    document.body.addEventListener('mousemove', (e) => {
      const r = name.getBoundingClientRect();
      const centerX = r.left + r.width / 2;
      const centerY = r.top + r.height / 2;

      const dx = e.clientX - centerX;
      const dy = e.clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 120) {
        const angle = Math.atan2(dy, dx);
        const moveX = Math.cos(angle) * -80;
        const moveY = Math.sin(angle) * -80;
        name.style.transform = `translate(${moveX}px, ${moveY}px)`;
      } else {
        name.style.transform = 'translate(0,0)';
      }
    });
  </script>

</body>
</html>
