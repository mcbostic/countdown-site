<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matthew Bostic</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0c10;
      --text: #e7e9ee;
      --muted: #9aa3b2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: min(95vw, 1400px);
      margin: 0 auto;
      padding: 40px 0 30px;
      text-align: center;
    }

    h1 {
      font-size: clamp(36px, 6vw, 72px);
      font-weight: 600;
      line-height: 1.1;
      margin: 0 0 30px 0;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      display: inline-block;
    }

    .stream {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(255,255,255,0.04),
        0 0 80px rgba(255,255,255,0.02);
    }

    .stream iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .subtitle {
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .container {
        width: 100vw;
        padding: 24px 12px;
      }

      .stream {
        border-radius: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="name">Matthew Bostic</h1>

    <div class="stream">
      <iframe
        src="https://player.twitch.tv/?channel=twucky&parent=matthewbostic.com&parent=matthewbostic.github.io"
        allowfullscreen>
      </iframe>
    </div>

    <div class="subtitle">
      Live Bambu H2D Printer Cam
    </div>
  </div>

  <script>
    const name = document.getElementById('name');

    document.addEventListener('mousemove', (e) => {
      const r = name.getBoundingClientRect();

      const centerX = r.left + r.width / 2;
      const centerY = r.top + r.height / 2;

      const dx = e.clientX - centerX;
      const dy = e.clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 120) {
        const angle = Math.atan2(dy, dx);
        const moveX = Math.cos(angle) * -80;
        const moveY = Math.sin(angle) * -80;

        name.style.transform =
          `translate(${moveX}px, ${moveY}px)`;
      } else {
        name.style.transform = 'translate(0,0)';
      }
    });
  </script>
</body>
</html>
